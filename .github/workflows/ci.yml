name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, verify the embedded index, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The committed snapshot must match its own manifest, or the package
      # would ship an index it refuses to load.
      - run: node dist/cli.js verify-index --dir index
      - run: npm test
