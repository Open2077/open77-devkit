<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eval_shop</title>
  <link rel="stylesheet" href="shop.css">
</head>
<body>
  <div id="shop" role="dialog" aria-labelledby="shop-title">
    <header>
      <h1 id="shop-title">Night City Supply</h1>
      <button id="close" type="button" title="Close (Esc / F6)">&times;</button>
    </header>
    <div id="balance-row">Balance: <span id="balance">&ndash;</span> E$</div>
    <ul id="items"></ul>
    <footer id="hint">Prices are set by the server. Esc or F6 closes.</footer>
  </div>
  <script src="shop.js"></script>
</body>
</html>
